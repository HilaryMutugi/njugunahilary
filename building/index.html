  .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center;max-width:820px}

  /* character */
  .breathe{animation:breathe 3s ease-in-out infinite;transform-origin:480px 330px}

  .eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .handL{animation:typeL var(--spd,.32s) ease-in-out infinite alternate}
  .handR{animation:typeR var(--spd,.32s) ease-in-out infinite alternate}
  @keyframes typeL{to{transform:translateY(-7px)}}
  @keyframes typeR{from{transform:translateY(-7px)}to{transform:none}}
  .paused .handL,.paused .handR,.paused .head{animation-play-state:paused}
  .steam path{animation:steam 2.4s ease-in-out infinite;opacity:0}
  .steam path:nth-child(2){animation-delay:.8s}.steam path:nth-child(3){animation-delay:1.6s}
  @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.6}100%{opacity:0;transform:translateY(-18px)}}
  .glow{animation:glow 2s ease-in-out infinite}
  @keyframes glow{50%{opacity:.55}}
  .hat{animation:hat 2.2s ease-in-out infinite;transform-origin:480px 150px}
  @keyframes hat{50%{transform:rotate(6deg)}}
  .sun{transform-origin:150px 260px;transition:transform 2s ease}
  @keyframes orbit{to{transform:rotate(360deg)}}
  .hand-m{transform-origin:720px 110px;transition:transform .6s}
  .hand-h{transform-origin:720px 110px;transition:transform .6s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .idea{transition:transform 2.6s cubic-bezier(.2,.7,.3,1),opacity 2.6s}
  .built{animation:land .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes land{from{transform:translateY(-30px) scale(.3);opacity:0}}
  .bulb{animation:bulb 1.2s ease-out}
  @keyframes bulb{0%{transform:scale(0);opacity:0}40%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:0}}
  .rocket{animation:launch 3s ease-in forwards}
  @keyframes launch{0%{transform:translate(0,0)}100%{transform:translate(120px,-520px) rotate(10deg)}}
  /* Anita */
  #anita{transition:transform 1.4s cubic-bezier(.4,0,.2,1)}
  .sway{animation:sway 3.6s ease-in-out infinite;transform-origin:0px 290px}
  @keyframes sway{50%{transform:rotate(1.6deg)}}
  .puff{animation:puff 3.6s ease-in-out infinite;transform-origin:0 -40px}
  @keyframes puff{50%{transform:rotate(-3deg)}}
  .flame{animation:flick .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
  @keyframes flick{to{transform:scaleY(1.25) scaleX(.85)}}
  .bubble{animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.2);opacity:0}}
  /* v5 */
  .lvl{opacity:0;transition:opacity 1s ease}
  .lvl.show{opacity:1}
  .lvl.pop{animation:lvlPop .9s cubic-bezier(.2,1.6,.4,1)}
  @keyframes lvlPop{from{transform:scale(.3);opacity:0}}
  .bulbL{animation:tw 1.6s ease-in-out infinite alternate}
  @keyframes tw{from{opacity:.35}to{opacity:1}}
  .truck{animation:drive 11s linear infinite}
  @keyframes drive{from{transform:translateX(-40px)}to{transform:translateX(200px)}}
  .lampGlow{animation:glow 3s ease-in-out infinite}
  #anita.walking .sway{animation:walk .32s ease-in-out infinite alternate}
  @keyframes walk{from{transform:translateY(0) rotate(-2.5deg)}to{transform:translateY(-7px) rotate(2.5deg)}}
  #anita.dance .sway{animation:dance .42s ease-in-out 6 alternate}
  @keyframes dance{from{transform:rotate(-11deg) translateY(0)}to{transform:rotate(11deg) translateY(-16px)}}
  .toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:#f7c873;color:#1b2040;font-weight:bold;padding:9px 18px;border-radius:999px;font-size:14px;transition:transform .5s cubic-bezier(.2,1.4,.4,1);z-index:9;white-space:nowrap}
  .toast.on{transform:translate(-50%,0)}
</style>

function tone(f,dur=.15,type='sine',vol=.2,when=0,slide){if(!soundOn)return;const a=ac(),t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}

const LEVELS=[[3,'rPlant','a plant 🪴'],[5,'farm2','a second coop 🐔'],[6,'rFrame','a photo of you two 🖼️'],[10,'rLights','fairy lights ✨'],[12,'farm3','a feed mill 🏭'],[15,'rRug','a new rug'],[20,'rLamp','a reading lamp 💡'],[25,'farm4','a delivery truck 🚚'],[30,'rBunting','Afrifama bunting 🎏'],[40,'farm5','Fama 1.0 farms on the hills 🌱']];
function applyLevels(announce){
  let n=0;for(const [need,id,name] of LEVELS){const e=$(id);if(ship>=need&&!e.classList.contains('show')){e.classList.add('show');if(announce){n++;setTimeout(()=>{sfx.level();toast('🏠 Upgrade unlocked: '+name);e.classList.add('pop');burst(480,120,18)},400+n*900)}}}
}

/* --- save progress on this device --- */
try{const d=JSON.parse(localStorage.getItem('ab-stats')||'{}');ideas=d.ideas|0;cof=Math.max(1,d.cof|0);ship=d.ship|0;hearts=d.hearts|0}catch(e){}
$('ideas').textContent=ideas;$('cof').textContent=cof;$('ship').textContent=ship;$('hearts').textContent=hearts;applyLevels(false);
setInterval(()=>{try{localStorage.setItem('ab-stats',JSON.stringify({ideas,cof,ship,hearts}))}catch(e){}},4000);

/* --- window chicken: hops, faces the right way, and flies --- */
const chick=$('winChick'),cBody=$('chickBody');scene.insertBefore(chick,fx);chick.style.transition='opacity .4s';
let cx=275,cy=262,chickHere=false,run=0,flapTimer=null,chickT=[];
const wait=ms=>new Promise(r=>chickT.push(setTimeout(r,ms)));
function face(d){cBody.style.transform=d<0?'scaleX(-1)':'scaleX(1)'}
function cset(x,y){cx=x;cy=y;chick.style.transform=`translate(${x}px,${y}px)`}
function stopChick(){chick.getAnimations().forEach(a=>{try{a.commitStyles()}catch(e){}a.cancel()});const m=/translate\(([-\d.]+)px,\s*([-\d.]+)px/.exec(chick.style.transform);if(m){cx=+m[1];cy=+m[2]}$('chWing').getAnimations().forEach(a=>a.cancel());clearInterval(flapTimer);chickT.forEach(clearTimeout);chickT=[]}
function hopTo(x,y,ms=1100){return new Promise(res=>{face(x<cx?-1:1);const n=Math.max(2,Math.round(Math.abs(x-cx)/16)),fr=[];for(let i=0;i<=n;i++){const t=i/n;fr.push({transform:`translate(${cx+(x-cx)*t}px,${cy+(y-cy)*t-(i%2?8:0)}px)`})}
  for(let i=0;i<n/2;i++)setTimeout(sfx.step,i*ms/(n/2));const a=chick.animate(fr,{duration:ms});a.onfinish=()=>{cset(x,y);res()}})}
function flyTo(x,y,ms=1700){return new Promise(res=>{face(x<cx?-1:1);const w=$('chWing');w.style.transformOrigin='-3px -13px';w.animate([{transform:'scaleY(1)'},{transform:'scaleY(-1.6)'}],{duration:90,iterations:Infinity,direction:'alternate'});
  sfx.flap();clearInterval(flapTimer);flapTimer=setInterval(sfx.flap,420);
  const fr=[],n=30,top=Math.min(cy,y)-60-Math.random()*50;
  for(let i=0;i<=n;i++){const t=i/n;fr.push({transform:`translate(${cx+(x-cx)*t}px,${cy+(y-cy)*t+(top-Math.min(cy,y))*4*t*(1-t)+Math.sin(t*Math.PI*7)*6}px) rotate(${Math.sin(t*Math.PI*5)*8}deg)`})}
  const a=chick.animate(fr,{duration:ms,easing:'ease-in-out'});a.onfinish=()=>{clearInterval(flapTimer);w.getAnimations().forEach(b=>b.cancel());cset(x,y);res()}})}
function peck(times=3){const h=$('chHead');h.style.transformOrigin='6px -20px';h.animate([{transform:'rotate(0)'},{transform:'rotate(30deg)'},{transform:'rotate(0)'}],{duration:280,iterations:times});for(let i=0;i<times;i++)setTimeout(sfx.tok,140+i*280)}
const SPOTS=[
  {x:566,y:268,cap:'A hen is reviewing your code. 🐔',line:'Hey! That is my laptop. 😂'},
  {x:480,y:94,cap:'New hat, who dis? 🐔',line:'Ehh! My party hat! 😂'},
  {x:715,y:232,cap:'Shelf inspection by the Chief Hen Officer.',line:'She is auditing the shelf now. 😅'},
  {x:642,y:395,cap:'The hen found the snacks.',line:'Not near the pilau! 😂'},
  {x:868,y:200,cap:'The hen chose Anita. Smart hen.',line:'Traitor. 😂'}];
async function goHome(my){sfx.cluck();await flyTo(205,262);if(my!==run)return;await hopTo(275,262);if(my!==run)return;chick.style.opacity=0;chickHere=false}
async function adventure(my){
  const s=SPOTS[Math.random()*SPOTS.length|0];sfx.cluck();setCap('Bwak! She is airborne! 🐔✈️');
  await flyTo(s.x,s.y);if(my!==run)return;
  setCap(s.cap);peck(3);await wait(1000);if(my!==run)return;
  if(s.x>800)anitaSays('Hello, chicken friend! 🐔');else{sfx.hmm();say(480,135,s.line)}
  await wait(2600);if(my!==run)return;peck(2);await wait(800);if(my!==run)return;
  await goHome(my);
}
async function chickVisit(){
  if(chickHere)return;chickHere=true;const my=++run;
  face(-1);cset(275,262);chick.style.opacity=1;
  await hopTo(205,262);if(my!==run)return;
  peck(3);if(Math.random()<.5)setCap(['Tok tok tok. The flock wants a meeting. 🐔','A chicken is checking on your KPIs.','Even the hens think you should sleep.'][Math.random()*3|0]);
  await wait(2400);if(my!==run)return;peck(4);await wait(1800);if(my!==run)return;
  if(Math.random()<.35){await adventure(my);return}
  await hopTo(275,262);if(my!==run)return;chick.style.opacity=0;chickHere=false;
}
chick.addEventListener('click',e=>{e.stopPropagation();if(!chickHere)return;stopChick();const my=++run;adventure(my)});
setTimeout(chickVisit,5000);setInterval(()=>{if(Math.random()<.6)chickVisit()},24000);

/* --- Anita errands --- */
let errT=[];
function T(fn,ms){errT.push(setTimeout(fn,ms))}
function setAnita(x){$('anita').style.transform=`translate(${x}px,245px)`}
function walk(on){$('anita').classList.toggle('walking',on);if(on)for(let i=0;i<4;i++)setTimeout(sfx.step,i*330)}
function cancelErrand(){errT.forEach(clearTimeout);errT=[];if(away){$('aItem').style.display='none';$('aBook').style.display='';walk(false);setAnita(880);if(nightHold){nightHold=false;busy=false;scene.classList.remove('paused')}}away=false}
const FOOD=[['☕','Tea break, Love. ☕'],['🍛','Pilau, Love. Eat. 🍛'],['🍉','Fruit. Brain food. 🍉'],['🍲','You said you ate. Eat again. 🍲'],['🥤','Juice. Hydrate, CEO. 🥤']];
let nightHold=false;
function errand(kind){
  if(busy||away)return;away=true;
  if(!kind)kind=lateNight()?'night':(Math.random()<.25?'peek':'food');
  if(kind==='peek'){
    walk(true);setAnita(760);
    T(()=>{walk(false);anitaSays(['Hmm. That logo needs more spacing.','Is that... another spreadsheet? 👀','Looks good, Love. Now save it. 💾'][Math.random()*3|0])},1500);
    T(()=>{sfx.hmm();say(480,135,['Yes, boss. 😅','Saving, saving!','Okay okay, spacing. 😂'][Math.random()*3|0])},3600);
    T(()=>{walk(true);setAnita(880)},5600);T(()=>{walk(false);away=false},7100);return;
  }
  if(kind==='night'){
    walk(true);setAnita(760);
    T(()=>{walk(false);busy=true;nightHold=true;scene.classList.add('paused');anitaSays('Past midnight, Love. Laptop closed. 😴')},1500);
    T(()=>{sfx.hmm();say(480,135,'Okay okay... five more minutes. 😅')},4200);
    T(()=>{busy=false;nightHold=false;scene.classList.remove('paused');walk(true);setAnita(880)},6800);T(()=>{walk(false);away=false},8300);return;
  }
  const [emo,line]=FOOD[Math.random()*FOOD.length|0];
  walk(true);setAnita(1070);
  T(()=>{$('aBook').style.display='none';$('aItem').textContent=emo;$('aItem').style.display='';setAnita(760)},2600);
  T(()=>{walk(false);anitaSays(line)},4100);
  T(()=>{$('aItem').style.display='none';$('aBook').style.display='';const t=el('text',{x:620,y:394,'font-size':24,class:'built'},emo);t.style.transformOrigin='632px 385px';fx.appendChild(t);sfx.land();
    setTimeout(()=>t.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.2)'}],{duration:900,fill:'forwards'}).onfinish=()=>t.remove(),9000)},5000);
  T(()=>{sfx.hmm();say(480,135,'Asante, Love! ❤️');heart()},6200);
  T(()=>{walk(true);setAnita(880)},8200);T(()=>{walk(false);away=false},9700);
}
setTimeout(()=>errand(),14000);setInterval(()=>{if(Math.random()<.75)errand()},32000);

/* --- secret: tap Anita 5 times --- */
let taps=[];
function danceTap(){const now=Date.now();taps=taps.filter(t=>now-t<2500);taps.push(now);if(taps.length>=5){taps=[];const a=$('anita');a.classList.remove('dance');void a.getBBox();a.classList.add('dance');sfx.dance();anitaSays('💃 Birthday dance!');for(let i=0;i<5;i++)setTimeout(heart,i*400);setTimeout(()=>a.classList.remove('dance'),2600);return true}return false}
