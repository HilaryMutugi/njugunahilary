  .bubble{animation:pop .3s cubic-bezier(.2,1.6,.4,1)}

let AC=null,master=null,soundOn=false,musicOn=false,musicTimer=null,typingTimer=null;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,dur=.15,type='sine',vol=.2,when=0,slide){if(!soundOn)return;const a=ac(),t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
function noise(dur=.03,vol=.06,f=2500,when=0,sweep,q=1.2){if(!soundOn)return;const a=ac(),t=a.currentTime+when,len=Math.max(1,a.sampleRate*dur|0),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=buf;const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=q;bp.frequency.setValueAtTime(f,t);if(sweep)bp.frequency.exponentialRampToValueAtTime(sweep,t+dur);const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(bp);bp.connect(g);g.connect(master);s.start(t)}

  rooster(){tone(520,.14,'sawtooth',.06,0,820);tone(820,.12,'sawtooth',.06,.16,700);tone(760,.55,'sawtooth',.07,.3,460);tone(1040,.14,'square',.02,0,1640)}
};
function typingLoop(){clearTimeout(typingTimer);if(soundOn&&!busy){noise(.025,.045,2200+Math.random()*1800);if(Math.random()<.08)noise(.04,.06,900)}const spd=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--spd'))||.32;typingTimer=setTimeout(typingLoop,spd*1000*(.6+Math.random()*.8))}
/* lo-fi loop */
const CHORDS=[[261.6,329.6,392,493.9],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,349.2]];let bar=0;
function musicBar(){if(!musicOn||!soundOn)return;const a=ac(),t0=a.currentTime+.05,ch=CHORDS[bar++%4],L=2.4;
  ch.forEach(f=>{const o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();o.type='triangle';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=900;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.035,t0+.3);g.gain.linearRampToValueAtTime(.0001,t0+L);o.connect(lp);lp.connect(g);g.connect(master);o.start(t0);o.stop(t0+L+.1)});
  const bass=a.createOscillator(),bg=a.createGain();bass.type='sine';bass.frequency.value=ch[0]/2;bg.gain.setValueAtTime(.12,t0);bg.gain.exponentialRampToValueAtTime(.001,t0+L);bass.connect(bg);bg.connect(master);bass.start(t0);bass.stop(t0+L);
  for(let b=0;b<4;b++){const t=b*L/4;if(b%2===0){const k=a.createOscillator(),kg=a.createGain();k.frequency.setValueAtTime(130,t0+t);k.frequency.exponentialRampToValueAtTime(45,t0+t+.18);kg.gain.setValueAtTime(.22,t0+t);kg.gain.exponentialRampToValueAtTime(.001,t0+t+.2);k.connect(kg);kg.connect(master);k.start(t0+t);k.stop(t0+t+.22)}else noise(.12,.05,1800,t+.0,null,.7);noise(.03,.025,7000,t+L/8)}
}
function setSound(v){soundOn=v;const b=$('bSound');b.textContent=v?'🔊 Sound on':'🔇 Sound off';b.classList.toggle('on',v);if(v){ac();typingLoop()}else{musicOn=false;$('bMusic').classList.remove('on');clearInterval(musicTimer)}}
function setMusic(v){if(v&&!soundOn)setSound(true);musicOn=v;$('bMusic').classList.toggle('on',v);clearInterval(musicTimer);if(v){musicBar();musicTimer=setInterval(musicBar,2400)}}
/* Happy Birthday (traditional melody) */
const N={G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,F5:698.5,G5:784};
const HB=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3]];
function playHB(){let t=0;const beat=.36;HB.forEach(([n,d])=>{tone(N[n],d*beat*.95,'triangle',.16,t);tone(N[n]*2,d*beat*.6,'sine',.04,t);t+=d*beat});return t}

/* ---------- visuals ---------- */
function el(tag,attrs,txt){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt)e.textContent=txt;return e}
function say(x,y,text,color='#ffffff',ink='#1b2040',ms=2600){
  const g=el('g',{class:'bubble'});g.style.transformOrigin=`${x}px ${y}px`;
  const t=el('text',{x:0,y:0,'font-size':14,fill:ink,'font-family':'Trebuchet MS'},text);fx.appendChild(g);g.appendChild(t);
  const w=t.getComputedTextLength()+24;let bx=Math.min(Math.max(x-w/2,8),952-w);
  const r=el('rect',{x:bx,y:y-34,width:w,height:30,rx:15,fill:color});const tail=el('path',{d:`M${x-6} ${y-5} L${x} ${y+6} L${x+6} ${y-5}Z`,fill:color});
  g.insertBefore(tail,t);g.insertBefore(r,tail);t.setAttribute('x',bx+12);t.setAttribute('y',y-14);
  setTimeout(()=>g.animate([{opacity:1},{opacity:0}],{duration:400}).onfinish=()=>g.remove(),ms);
}
function smile(big){if(big){$('browL').setAttribute('d','M448 186 q12 -9 24 0');$('browR').setAttribute('d','M488 186 q12 -9 24 0');$('mouth').setAttribute('d','M462 236 q18 20 36 0')}else{$('browL').setAttribute('d','M448 192 q12 -6 24 0');$('browR').setAttribute('d','M488 192 q12 -6 24 0');$('mouth').setAttribute('d','M466 240 q14 10 28 0')}}
function idea(auto){
  if(busy){if(auto)return;endSurprise()}
  const [emo,label]=IDEAS[Math.random()*IDEAS.length|0];
  ideas++;$('ideas').textContent=ideas;sfx.idea();
  const b=el('text',{x:530,y:110,'font-size':34,class:'bulb'},'💡');b.style.transformOrigin='545px 100px';fx.appendChild(b);setTimeout(()=>b.remove(),1200);
  smile(true);setTimeout(()=>{if(!busy)smile(false)},900);
  const g=el('g',{class:'idea'});
  g.appendChild(el('rect',{x:-50,y:-22,width:100,height:44,rx:22,fill:'#ffffff',opacity:.95}));
  g.appendChild(el('text',{x:-36,y:8,'font-size':20},emo));
  g.appendChild(el('text',{x:-10,y:5,'font-size':11,fill:'#1b2040','font-family':'Trebuchet MS'},label));
  g.style.transform='translate(480px,275px) scale(.3)';g.style.opacity=0;fx.appendChild(g);
  const tx=380+Math.random()*340,ty=50+Math.random()*120;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{g.style.transform=`translate(${tx}px,${ty}px) scale(1)`;g.style.opacity=1}));
  setTimeout(()=>{g.style.opacity=0},2800);setTimeout(()=>g.remove(),5400);
  if(ideas%3===0)setTimeout(()=>build(emo),700);
}
function build(emo){
  ship++;$('ship').textContent=ship;sfx.land();
  if(shelfItems.length>=5)shelfItems.shift().remove();
  shelfItems.forEach((t,i)=>t.setAttribute('x',580+i*33));
  const t=el('text',{x:580+shelfItems.length*33,y:229,'font-size':26,class:'built'},emo);shelf.appendChild(t);shelfItems.push(t);
}
function coffee(){
  if(busy)endSurprise();
  cof++;$('cof').textContent=cof;sfx.coffee();
  document.documentElement.style.setProperty('--spd',Math.max(.08,.32-cof*.035)+'s');
  for(let i=0;i<3;i++)setTimeout(()=>idea(true),i*260);
  setCap(cof>6?'Okay, that is a lot of coffee. ⚡':'Typing speed: upgraded.');
  if(cof===8)setTimeout(()=>{anitaSays('That is enough coffee, mister. ☕🚫')},900);
}
function burst(x,y,n=24){for(let i=0;i<n;i++){const c=el('circle',{cx:x,cy:y,r:3+Math.random()*3,fill:['#f7c873','#e05a4f','#9be7c4','#8fd3ff','#c792ea'][i%5]});fx.appendChild(c);const a=Math.random()*Math.PI*2,d=80+Math.random()*160;c.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+40}px)`,opacity:0}],{duration:1400,easing:'ease-out'}).onfinish=()=>c.remove()}}
function launch(){
  if(busy)endSurprise();
  const r=el('text',{x:450,y:300,'font-size':44,class:'rocket'},'🚀');fx.appendChild(r);setTimeout(()=>r.remove(),3100);
  sfx.ship();burst(480,300);build(['🏭','🐔','📱','🚚'][Math.random()*4|0]);setCap('Shipped! Next one. 🚀');
}
function setCap(t){const c=$('cap');c.style.opacity=0;setTimeout(()=>{c.textContent=t;c.style.opacity=1},350)}
function anitaPos(){const m=/translate\(([-\d.]+)px/.exec($('anita').style.transform);return m?+m[1]:880}
function anitaSays(t){say(anitaPos(),190,t,'#f3e8ff','#4c1d95');sfx.sparkle()}
function heart(){
  hearts++;$('hearts').textContent=hearts;sfx.heart();
  const x0=anitaPos()-10,h=el('text',{x:x0,y:250,'font-size':24},['💛','❤️','💜'][Math.random()*3|0]);fx.appendChild(h);
  h.animate([{transform:'translate(0,0) scale(.6)',opacity:0},{transform:`translate(${(480-x0)*.5}px,-90px) scale(1.2)`,opacity:1,offset:.5},{transform:`translate(${480-x0}px,-40px) scale(.8)`,opacity:0}],{duration:2200,easing:'ease-in-out'}).onfinish=()=>{h.remove();if(!busy){smile(true);setTimeout(()=>{if(!busy)smile(false)},700)}};
}
function rooster(){
  sfx.rooster();setCap('The roosters disagree with your bedtime. 🐓');
  const c=el('text',{x:60,y:255,'font-size':22},'🐓');$('chickRun').appendChild(c);
  c.animate([{transform:'translateX(0)'},{transform:'translateX(190px)'}],{duration:2200,easing:'linear'}).onfinish=()=>c.remove();
}

/* ---------- Anita's surprise ---------- */
let cakeLit=false,resetTimer=null,safety=null;
function endSurprise(){clearTimeout(resetTimer);clearTimeout(safety);cakeLit=false;$('aCake').style.display='none';$('aBook').style.display='';$('anita').style.transform='translate(880px,245px)';scene.classList.remove('paused');smile(false);busy=false;$('bCake').textContent="🎂 Anita's surprise"}
function surprise(){
  if(cakeLit){blow();return}
  if(busy)return;busy=true;if(!soundOn)setSound(true);
  safety=setTimeout(()=>{if(busy){endSurprise();setCap('Okay... back to building. 😄')}},40000);
  scene.classList.add('paused');smile(true);
  $('anita').style.transform='translate(760px,245px)';
  setCap('Wait... who is that coming in? 👀');
  setTimeout(()=>{
    if(!busy)return;
    $('aBook').style.display='none';$('aCake').style.display='';$('flames').style.display='';cakeLit=true;$('bCake').textContent='🕯️ Blow the candles';
    anitaSays('Close the laptop, Love. It is your birthday! 🎂');
    const dur=playHB();
    for(let i=0;i<6;i++)setTimeout(heart,i*900);
    setCap('🎶 Happy birthday to you... 🎶');
    setTimeout(()=>{if(cakeLit)setCap('Tap the cake (or the button) to blow out the candles 🕯️')},dur*1000+300);
  },1500);
}
function blow(){
  if(!cakeLit)return;cakeLit=false;sfx.puff();
  $('flames').style.display='none';
  for(let i=0;i<3;i++){const s=el('circle',{cx:anitaPos()-19+i*19,cy:325,r:6,fill:'#cfd6ea',opacity:.7});fx.appendChild(s);s.animate([{transform:'translate(0,0) scale(1)',opacity:.7},{transform:'translate(0,-50px) scale(2.5)',opacity:0}],{duration:1200}).onfinish=()=>s.remove()}
  setTimeout(()=>{burst(anitaPos(),330,40);[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.1,i*.08));say(480,135,'Best gift: you. Thanks, Love! ❤️');setCap('Wish made. 🌟')},400);
  $('bCake').textContent="🎂 Anita's surprise";
  resetTimer=setTimeout(()=>{endSurprise();setCap('Okay... just one more idea. 😄')},4200);
}

/* ---------- wiring ---------- */
$('bSound').onclick=()=>setSound(!soundOn);
$('bMusic').onclick=()=>setMusic(!musicOn);
$('bIdea').onclick=()=>idea();$('bCof').onclick=coffee;$('bShip').onclick=launch;$('bCake').onclick=surprise;
$('mug').addEventListener('click',e=>{e.stopPropagation();coffee()});
$('window').addEventListener('click',e=>{e.stopPropagation();rooster()});
$('hHead').addEventListener('click',e=>{e.stopPropagation();if(busy)return;sfx.hmm();say(480,135,H_LINES[Math.random()*H_LINES.length|0])});
$('anita').addEventListener('click',e=>{e.stopPropagation();if(cakeLit){blow();return}if(busy)return;anitaSays(A_LINES[Math.random()*A_LINES.length|0]);heart()});
scene.addEventListener('click',()=>idea());

setInterval(()=>idea(true),2800);
setInterval(()=>{if(busy)return;ci=(ci+1)%CAPS.length;setCap(CAPS[ci])},4400);
setInterval(()=>{if(!busy)heart()},11000);
setInterval(()=>{if(!busy&&Math.random()<.5)anitaSays(A_LINES[Math.random()*A_LINES.length|0])},17000);
setTimeout(()=>idea(true),600);
</script>
